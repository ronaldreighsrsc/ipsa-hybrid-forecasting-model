name: Daily Data Automation

on:
  schedule:
    # 22:00 UTC = 18:00 Chile (Invierno) / 19:00 Chile (Verano)
    - cron: '0 22 * * 1-5' # De Lunes a Viernes
  workflow_dispatch: # Permite ejecutar el bot manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests openpyxl
          
      - name: Run Data Updater
        run: python src/data_engineering/auto_updater.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/
          
          # Solo hacer commit si hubo cambios en los datos
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: actualizacion automatica de datos financieros" && git push)
